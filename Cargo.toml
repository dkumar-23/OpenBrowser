[workspace]
resolver = "2"
members = [
    "crates/runtime-observability",
    "crates/runtime-sandbox",
    "crates/runtime-auth",
    "crates/runtime-policy",
    "crates/runtime-core",
    "crates/runtime-network",
    "crates/runtime-adapters-http",
    "crates/runtime-dom",
    "crates/runtime-cli",
    "crates/runtime-interaction",
    "crates/runtime-js",
    "crates/runtime-browser",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
futures = "0.3"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
